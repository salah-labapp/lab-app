let DB;
function fresh(){const d={v:1,seq:{p:0,t:0,o:0,i:0},patients:[],tests:[],orders:[],settings:{lab_name:"معمل التحاليل الطبية",lab_phone:"",lab_address:"",currency:"ج.م",pathologist:""}};
 SEED.forEach(s=>d.tests.push({id:++d.seq.t,name:s[0],category:s[1],price:s[2],unit:s[3],ref_low:s[4],ref_high:s[5],ref_text:s[6]}));d.seed2=1;return d}
function load(){try{const r=localStorage.getItem(KEY);DB=r?JSON.parse(r):fresh();if(!DB.seed2){const have=new Set(DB.tests.map(t=>t.name.toLowerCase()));SEED.forEach(s=>{if(!have.has(s[0].toLowerCase()))DB.tests.push({id:++DB.seq.t,name:s[0],category:s[1],price:s[2],unit:s[3],ref_low:s[4],ref_high:s[5],ref_text:s[6]})});DB.seed2=1;save()}}catch(e){DB=fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast("تعذر الحفظ: "+e.message,1)}}
class Err extends Error{}
const num=(v,d=null)=>{if(v===""||v==null)return d;const n=Number(v);if(!isFinite(n))throw new Err("قيمة رقمية غير صحيحة");return n};
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=x=>String(Math.round(x*100)/100);
// ---- core logic ----
const Core={
 addPatient(b,id){const name=(b.name||"").trim();if(!name)throw new Err("اسم المريض مطلوب");let age=num(b.age);if(age!=null&&(age<0||age>130))throw new Err("السن غير صحيح");
  const rec={name,age,gender:b.gender||"",phone:b.phone||"",doctor:b.doctor||""};
  if(id){Object.assign(DB.patients.find(p=>p.id==id),rec);save();return id}
  rec.id=++DB.seq.p;rec.created=now();DB.patients.unshift(rec);save();return rec.id},
 delPatient(id){if(DB.orders.some(o=>o.patient_id==id))throw new Err("لا يمكن حذف مريض له تحاليل مسجلة");DB.patients=DB.patients.filter(p=>p.id!=id);save()},
 saveTest(b,id){const name=(b.name||"").trim();if(!name)throw new Err("اسم التحليل مطلوب");const price=num(b.price,0);if(price<0)throw new Err("السعر لا يمكن أن يكون سالباً");
  if(DB.tests.some(t=>t.name.toLowerCase()==name.toLowerCase()&&t.id!=id))throw new Err("اسم التحليل موجود بالفعل");
  const rec={name,category:b.category||"",price,unit:b.unit||"",ref_low:num(b.ref_low),ref_high:num(b.ref_high),ref_text:b.ref_text||""};
  if(id){Object.assign(DB.tests.find(t=>t.id==id),rec);save();return id}rec.id=++DB.seq.t;DB.tests.push(rec);save();return rec.id},
 delTest(id){DB.tests=DB.tests.filter(t=>t.id!=id);save()},

  DB.orders.unshift(o);save();return o.id},

function brSet(k,inp){const f=inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=guard(()=>{let w=im.naturalWidth,h=im.naturalHeight;if(k=="photo"){const m=Math.min(w,h),c=document.createElement("canvas");c.width=c.height=BR_MAX.photo;c.getContext("2d").drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,BR_MAX.photo,BR_MAX.photo);DB.settings.img_photo=c.toDataURL("image/jpeg",.85)}else{const r=Math.min(1,BR_MAX[k]/w),c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(h*r);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);DB.settings["img_"+k]=c.toDataURL("image/jpeg",.85)}URL.revokeObjectURL(u);save();toast("تم حفظ الصورة على الجهاز");settings()});im.onerror=()=>toast("الملف مش صورة",1);im.src=u}
function brDel(k){DB.settings["img_"+k]="";save();settings()}
function brCard(){return `<div class="card bset"><h3>صور تقرير النتيجة</h3><small>الصور بتتحفظ على الجهاز ده بس ومبتترفعش على أي موقع.</small>`+["head","photo","foot"].map(k=>`<div style="margin-top:8px"><b>${BR_LABEL[k]}</b>${brImg(k)?`<img src="${brImg(k)}"><button class=d onclick="brDel('${k}')">حذف</button>`:"<br><small>لا توجد صورة</small>"}<input type=file accept="image/*" onchange="brSet('${k}',this)"></div>`).join("")+`</div>`}
function printHTML(kind,oid){const o=DB.orders.find(x=>x.id==oid),p=DB.patients.find(x=>x.id==o.patient_id)||{},s=DB.settings,t=Core.totals(o),c=esc(s.currency);
 const bh=brImg('head'),bp=brImg('photo'),bf=brImg('foot');let h=(kind=="result"&&(bh||bp))?`<div class=bn>${bh?`<img class=hd src="${bh}">`:''}${bp?`<img class=ph src="${bp}">`:''}</div>`:`<div class=h><h1>${esc(s.lab_name)}</h1><div>${esc(s.lab_address)} ${esc(s.lab_phone)}</div></div>`;h+=`<div class=info><div>المريض: <b>${esc(p.name||"")}</b></div><div>رقم الطلب: ${o.id}</div><div>السن: ${esc(p.age??"")} | ${esc(p.gender||"")}</div><div>التاريخ: ${esc(o.created)}</div><div>الطبيب: ${esc(p.doctor||"")}</div></div>`;
 if(kind=="result"){h+="<table><tr><th>التحليل<th>النتيجة<th>الوحدة<th>المعدل الطبيعي</tr>"+o.items.map(i=>{const f=Core.flag(i);const ref=i.ref_text||(i.ref_low!=null&&i.ref_high!=null?fmt(i.ref_low)+" - "+fmt(i.ref_high):i.ref_low!=null?"> "+fmt(i.ref_low):i.ref_high!=null?"< "+fmt(i.ref_high):"");
   return `<tr><td>${esc(i.name)}<td ${f?"style='font-weight:bold'":""}>${esc(i.result)}${f=="H"?" ▲ (مرتفع)":f=="L"?" ▼ (منخفض)":""}<td>${esc(i.unit)}<td>${esc(ref)}</tr>`}).join("")+"</table>";
   if(o.notes)h+=`<p>ملاحظات: ${esc(o.notes)}</p>`;h+=`<div class=foot><span>${esc(s.pathologist)}</span><span>ختم المعمل</span></div>${bf?`<div class=bf><img src="${bf}"></div>`:''}`}
 else{h+="<table><tr><th>التحليل<th>السعر</tr>"+o.items.map(i=>`<tr><td>${esc(i.name)}${(i.qty||1)>1?" ×"+i.qty:""}<td>${fmt((i.price||0)*(i.qty||1))} ${c}</tr>`).join("")+`<tr><td>الإجمالي<td>${fmt(t.subtotal)} ${c}</tr><tr><td>الخصم<td>${fmt(o.discount||0)} ${c}</tr><tr><td><b>الصافي</b><td><b>${fmt(t.total)} ${c}</b></tr><tr><td>المدفوع<td>${fmt(o.paid||0)} ${c}</tr><tr><td>المتبقي<td>${fmt(t.remaining)} ${c}</tr></table>`}
 return h}
function showPrint(kind,oid){const pv=$("printv");pv.innerHTML=`<div class=np style="margin-bottom:8px"><button onclick="window.print()">🖨 طباعة / حفظ PDF</button> <button class=g onclick="go('orders',${oid})">رجوع</button></div>`+printHTML(kind,oid);document.body.classList.add("printing");scrollTo(0,0)}
function settings(){const s=DB.settings;M.innerHTML=`<div class=card><h3>بيانات المعمل (تظهر في الطباعة)</h3>اسم المعمل<input id=s1 value="${esc(s.lab_name)}">العنوان<input id=s2 value="${esc(s.lab_address)}">الهاتف<input id=s3 value="${esc(s.lab_phone)}">العملة<input id=s4 value="${esc(s.currency)}">اسم الدكتور (للتوقيع)<input id=s5 value="${esc(s.pathologist)}"><button onclick="saveSet()">حفظ</button></div>
 ${brCard()}<div class=card><h3>النسخ الاحتياطي</h3><small>البيانات محفوظة على هذا الجهاز فقط. خد نسخة احتياطية بانتظام.</small><button style="width:100%" onclick="exportData()">تصدير نسخة احتياطية</button><input type=file id=imf accept=".json,application/json" onchange="importData(this)"></div>`}
const saveSet=guard(()=>{Object.assign(DB.settings,{lab_name:s1.value,lab_address:s2.value,lab_phone:s3.value,currency:s4.value,pathologist:s5.value});save();$("hd").textContent=DB.settings.lab_name;toast("تم الحفظ")});
function exportData(){const blob=new Blob([JSON.stringify(DB)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lab-backup-"+now().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},2000)}
function importData(inp){const f=inp.files[0];if(!f)return;if(!confirm("سيتم استبدال كل البيانات الحالية بالنسخة الاحتياطية. متأكد؟")){inp.value="";return}const r=new FileReader();r.onload=guard(()=>{Core.importData(r.result);toast("تم الاسترجاع");go("home")});r.readAsText(f)}

 localStorage.removeItem(KEY);DB=fresh();DB.tests=[];[["CBC - صورة دم كاملة","هيماتولوجي",120,"",null,null,""],["Hemoglobin - هيموجلوبين","هيماتولوجي",50,"g/dL",12,16,""],["TSH","هرمونات",150,"uIU/mL",0.4,4,""],["Ferritin - فيريتين","كيمياء",200,"ng/mL",13,150,""],["Vitamin D (25-OH)","فيتامينات",450,"ng/mL",30,100,""],["Creatinine","كيمياء",50,"mg/dL",0.6,1.3,""],["HBsAg","مناعة",100,"",null,null,"Negative"]].forEach(x=>Core.saveTest({name:x[0],category:x[1],price:x[2],unit:x[3],ref_low:x[4],ref_high:x[5],ref_text:x[6]}));
 const pid=Core.addPatient({name:"رشا",age:32,gender:"أنثى"});const by={};DB.tests.forEach(t=>by[t.name.split(" ")[0]]=t.id);
 const oid=Core.addOrder({patient_id:pid,test_ids:[by.TSH,by.Ferritin,by.Vitamin],discount:50,paid:300});let o=DB.orders[0],t=Core.totals(o);
 ok("totals 800/750/450",t.subtotal==800&&t.total==750&&t.remaining==450);
 const m={};o.items.forEach(i=>m[i.id]={TSH:"2.85",Ferritin:"23.0",Vitamin:"14.9"}[i.name.split(" ")[0]]);Core.setResults(oid,m);
 const fl={};o.items.forEach(i=>fl[i.name.split(" ")[0]]=Core.flag(i));ok("flags",fl.TSH==""&&fl.Ferritin==""&&fl.Vitamin=="L");
 o.items[0].result="9";ok("high flag",Core.flag(o.items[0])=="H");o.items[0].result="";ok("blank no flag",Core.flag(o.items[0])=="");
 const rp=printHTML("result",oid);ok("result print",rp.includes("رشا")&&rp.includes("منخفض"));ok("invoice print",printHTML("invoice",oid).includes("750"));
 Core.saveTest({name:"TSH",price:999},by.TSH);ok("old order price unchanged",Core.totals(DB.orders[0]).subtotal==800);
 thr("empty name",()=>Core.addPatient({name:" "}));thr("age 500",()=>Core.addPatient({name:"x",age:500}));thr("neg price",()=>Core.saveTest({name:"n",price:-1}));
 thr("dup test",()=>Core.saveTest({name:"hemoglobin - هيموجلوبين",price:1}));thr("empty order",()=>Core.addOrder({patient_id:pid,test_ids:[]}));thr("bad patient",()=>Core.addOrder({patient_id:999,test_ids:[1]}));
 thr("discount>total",()=>Core.addOrder({patient_id:pid,test_ids:[by.HBsAg],discount:9999}));thr("delete patient with orders",()=>Core.delPatient(pid));
 const p2=(()=>{const x=DB.patients[0];const s=printHTML("result",oid);return s})();
 const xp=Core.addPatient({name:"<"+"script>alert(1)<"+"/script>"});const xo=Core.addOrder({patient_id:xp,test_ids:[by.TSH]});ok("xss escaped",!printHTML("result",xo).includes("<"+"script>"));
 const bak=JSON.stringify(DB);Core.delOrder(xo);Core.delPatient(xp);Core.importData(bak);ok("backup roundtrip",DB.orders.length==2&&DB.patients.length==2);
 thr("bad import",()=>Core.importData("{}"));thr("bad import json",()=>Core.importData("nope"));
 ok("seed count 355",SEED.length==355&&new Set(SEED.map(x=>x[0].toLowerCase())).size==355);
 const q1=Core.addOrder({patient_id:pid,items:[{id:by.TSH,qty:3}],discount:0,paid:0});ok("qty total 3x999",Core.totals(DB.orders[0]).subtotal==999*3&&DB.orders[0].items[0].qty==3);Core.delOrder(q1);
 thr("qty 0",()=>Core.addOrder({patient_id:pid,items:[{id:by.TSH,qty:0}]}));
 save();load();ok("persist reload",DB.orders.length==2);
 localStorage.removeItem(KEY);document.title=out.some(l=>l.startsWith("FAIL"))?"SELFTEST FAIL":"SELFTEST PASS";
 document.body.innerHTML="<pre id=r dir=ltr style='font-size:14px'>"+out.join("\n")+"</pre>"}
if(TEST_MODE){selfTest()}else{load();if(!DB.settings)DB=fresh();go(location.hash.slice(1).startsWith("order/")?"orders":(pages[location.hash.slice(1)]?location.hash.slice(1):"home"),location.hash.startsWith("#order/")?+location.hash.slice(7):undefined);
 if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})}
